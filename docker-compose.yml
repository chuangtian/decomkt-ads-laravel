services:
  setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: >-
      sh -c "test -f .env || cp .env.example .env;
      composer install --no-interaction --prefer-dist;
      grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force;
      php artisan migrate --force;
      php artisan db:seed --force"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      setup:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    depends_on:
      setup:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: decomkt_ads
      MYSQL_USER: decomkt
      MYSQL_PASSWORD: decomkt_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    depends_on:
      setup:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_data:
